# alembic config — Open Agent OS v1.6 (DB: openagentos + pgvector/pgvector:pg16; DB isolation: mattermost/outline/openagentos separate)
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# v1.6 default — overridden by DATABASE_URL env at runtime (see alembic/env.py)
sqlalchemy.url = postgresql+asyncpg://openagentos:secret@localhost:5432/openagentos

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[alembic:exclude]
tables = spatial_ref_sys
