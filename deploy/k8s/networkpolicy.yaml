# NetworkPolicy — default deny + allow postgres/redis/control-plane
# Namespace: open-agent-os
# - default-deny-all: deny all ingress/egress by default (fail-closed) + audit deny events
# - allow-dns-egress: allow egress to kube-dns (53 UDP/TCP) for service discovery — restricted to kube-system only
# - allow-postgres: allow ingress to postgres (5432) from control-plane, execution-gateway, security, admin-api
# - allow-redis: allow ingress to redis (6379) from same app pods
# - allow-control-plane: allow ingress to control-plane (8000) from ingress / admin / gateway
# - deny-audit: explicit audit for denied traffic (CNI policy audit logging — Cilium/Calico)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: open-agent-os
  annotations:
    description: "Default deny all ingress/egress — fail-closed. All deny events must be audited via CNI flow logs."
    audit/policy-deny: "true"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # No ingress/egress rules -> default deny. Explicit allows below override per-pod.
  # Audit: CNI (Cilium/Calico) must enable policy audit logging; denied flows forwarded to SIEM/audit pipeline.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: open-agent-os
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres
  namespace: open-agent-os
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: control-plane
        - podSelector:
            matchLabels:
              app: execution-gateway
        - podSelector:
            matchLabels:
              app: security
        - podSelector:
            matchLabels:
              app: admin-api
        - podSelector:
            matchLabels:
              app: memory-service
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis
  namespace: open-agent-os
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: control-plane
        - podSelector:
            matchLabels:
              app: execution-gateway
        - podSelector:
            matchLabels:
              app: security
        - podSelector:
            matchLabels:
              app: admin-api
        - podSelector:
            matchLabels:
              app: memory-service
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane
  namespace: open-agent-os
spec:
  podSelector:
    matchLabels:
      app: control-plane
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: execution-gateway
        - podSelector:
            matchLabels:
              app: security
        - podSelector:
            matchLabels:
              app: admin-api
        - podSelector:
            matchLabels:
              app: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    # Allow health/readiness from kubelet (no from = allow all within NS is too broad;
    # use explicit ingress-nginx + intra-app above; kubelet probes are exempt via hostNetwork fallback)
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-postgres-redis
  namespace: open-agent-os
spec:
  podSelector:
    matchLabels:
      app: control-plane
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app: security
      ports:
        - protocol: TCP
          port: 8002
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-security
  namespace: open-agent-os
spec:
  podSelector:
    matchLabels:
      app: security
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Deny audit — explicit audit for all denied traffic
# Requires CNI with NetworkPolicy audit/flow logging enabled:
# - Cilium: enable hubble + policy verdict logging, forward deny verdicts to audit sink
# - Calico: enable Felix PolicyAuditMode / flow logs
# All deny events from default-deny-all and per-pod policies MUST be collected
# and forwarded to the audit pipeline (SIEM / Loki / CloudWatch).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-audit
  namespace: open-agent-os
  annotations:
    description: "Deny audit — documents that all denied ingress/egress must be audit-logged via CNI flow/policy logs"
    audit/policy-deny: "true"
    audit/deny-action: "log"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # No rules -> deny all complements default-deny-all; existence signals audit requirement
  # CNI audit config (example):
  #   cilium: hubble --verdict DROPPED --since 1m
  #   calico: felixConfiguration.spec.policySyncPathPrefix + flowLogs
