apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-gateway
  namespace: open-agent-os
  labels:
    app: execution-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: execution-gateway
  template:
    metadata:
      labels:
        app: execution-gateway
    spec:
      containers:
        - name: execution-gateway
          image: open-agent-os/execution-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oaos-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oaos-secrets
                  key: REDIS_PASSWORD
                  optional: true
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: oaos-secrets
                  key: JWT_SIGNING_KEY
            - name: AUDIT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: oaos-secrets
                  key: AUDIT_SIGNING_KEY
            - name: OAOS_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: oaos-secrets
                  key: OAOS_SIGNING_KEY
            - name: AWS_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: oaos-config
                  key: AWS_S3_BUCKET
            - name: AWS_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: oaos-config
                  key: AWS_S3_REGION
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: oaos-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: oaos-config
                  key: POSTGRES_USER
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: oaos-config
                  key: LOG_LEVEL
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
