# ConfigMap — non-secret env (override per env)
# GRANT isolation: oaos must NOT access external DBs (mattermost, outline) on shared clusters.
# Apply docs/k8s-grant-isolation.sql as superuser after provisioning:
#   REVOKE ALL ON DATABASE mattermost FROM oaos;
#   REVOKE ALL ON DATABASE outline FROM oaos;
# See docs/k8s-grant-isolation.sql and SECURITY.md § DB isolation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oaos-config
  namespace: open-agent-os
data:
  POSTGRES_DB: "oaos"
  POSTGRES_USER: "oaos"
  TENANT_ID: "default"
  HERMES_BASE_URL: "http://execution-gateway:8001"
  AWS_S3_REGION: "ap-northeast-2"
  AWS_S3_PREFIX: "audit-checkpoints/"
  AWS_S3_BUCKET: ""  # set via: kubectl patch configmap oaos-config -p '{"data":{"AWS_S3_BUCKET":"my-bucket"}}'
  LOG_LEVEL: "info"
  OAOS_ENV: "production"  # prod fail-closed — must be production; dev override via kustomize/env
  # CORS whitelist (comma-separated origins); default allows localhost:3012,3000,8010,8100
  # OAOS_CORS_ORIGINS: "http://localhost:3012,http://localhost:3000,http://localhost:8010,http://localhost:8100"
  # Service URLs (intra-cluster)
  DATABASE_URL: "postgresql+asyncpg://oaos:$(POSTGRES_PASSWORD)@postgres:5432/oaos"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
