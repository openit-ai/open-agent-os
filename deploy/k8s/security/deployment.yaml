apiVersion: apps/v1
kind: Deployment
metadata:
  name: security
  namespace: open-agent-os
  labels:
    app: security
  annotations:
    oaos.hpa/minReplicas: "2"
    oaos.hpa/maxReplicas: "6"
    oaos.hpa/targetCPU: "70"
    oaos.hpa/targetMemory: "80"
    oaos.resources/limits: "cpu=1000m,memory=1Gi"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: security
  template:
    metadata:
      labels:
        app: security
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: security
                topologyKey: kubernetes.io/hostname
      containers:
        - name: security
          image: open-agent-os/security:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oaos-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oaos-secrets
                  key: REDIS_PASSWORD
                  optional: true
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: oaos-secrets
                  key: JWT_SIGNING_KEY
            - name: AUDIT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: oaos-secrets
                  key: AUDIT_SIGNING_KEY
            - name: OAOS_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: oaos-secrets
                  key: OAOS_SIGNING_KEY
            - name: OAOS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: oaos-secrets
                  key: OAOS_ENCRYPTION_KEY
            - name: AWS_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: oaos-config
                  key: AWS_S3_BUCKET
            - name: AWS_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: oaos-config
                  key: AWS_S3_REGION
            - name: AWS_S3_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: oaos-config
                  key: AWS_S3_PREFIX
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: oaos-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: oaos-config
                  key: POSTGRES_USER
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: oaos-config
                  key: LOG_LEVEL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
