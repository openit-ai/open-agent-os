# nginx — TLS termination sidecar for Open Agent OS prod (§5)
# Upstreams match docker-compose service names on oaos-net; for K8s use Ingress instead.
worker_processes auto;
events { worker_connections 1024; }
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Rate limit zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        location /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
        location / { return 301 https://$host$request_uri; }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # Health check (no auth)
        location /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }

        # Control Plane — /v1/sessions, /health, etc.
        location /v1/sessions {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://control-plane:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /health {
            proxy_pass http://control-plane:8000;
            proxy_set_header Host $host;
        }

        # Execution Gateway — /v1/execution/*
        location /v1/execution {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://execution-gateway:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Security — /v1/policy, /v1/audit, etc.
        location /v1/ {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://security:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fallback
        location / {
            proxy_pass http://control-plane:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
