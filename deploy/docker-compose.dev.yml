# deploy/docker-compose.dev.yml — local development (NOT for production)
# - All ports are bound to 127.0.0.1 only — never expose to 0.0.0.0. Change requires explicit override.
# - Dev defaults are intentionally literal (oaos/secret) for local bring-up only.
# - Production MUST use deploy/docker-compose.prod.yml with external secrets and OAOS_ENV=production.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: oaos
      POSTGRES_USER: oaos
      POSTGRES_PASSWORD: secret
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  control-plane:
    build: ../control-plane
    env_file: ../.env
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [postgres, redis]
  execution-gateway:
    build: ../execution-gateway
    env_file: ../.env
    ports: ["127.0.0.1:8001:8001"]
    depends_on: [postgres, redis]
  security:
    build: ../security
    env_file: ../.env
    ports: ["127.0.0.1:8002:8002"]
    depends_on: [postgres, redis]
volumes:
  pgdata:
