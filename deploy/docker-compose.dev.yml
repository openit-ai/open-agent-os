services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: open_agent_os
      POSTGRES_USER: open_agent_os
      POSTGRES_PASSWORD: secret
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  control-plane:
    build: ../control-plane
    env_file: ../.env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  execution-gateway:
    build: ../execution-gateway
    env_file: ../.env
    ports: ["8001:8001"]
    depends_on: [postgres, redis]
  security:
    build: ../security
    env_file: ../.env
    ports: ["8002:8002"]
    depends_on: [postgres, redis]
volumes:
  pgdata:
