# OAOS Project managed vhost
# Portal (ADR 0002): static introduction/guide page; /apply and /api/portal/ go to
# oaos-portal.service on loopback (the Mattermost button callback is /api/portal/decide).
server {
    listen 80;
    server_name __PORTAL_DOMAIN__;
    root __PORTAL_ROOT__;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~ ^/(apply/?|api/portal/.*)$ {
        proxy_pass http://127.0.0.1:__PORTAL_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        client_max_body_size 16k;
        proxy_read_timeout 60s;
    }
}
