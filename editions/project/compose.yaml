services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      MM_DB_PASSWORD: ${MM_DB_PASSWORD:?}
      OUTLINE_DB_PASSWORD: ${OUTLINE_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 10s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      retries: 12
  mattermost:
    image: mattermost/mattermost-team-edition:11.10.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8065:8065'
    environment:
      MM_SERVICESETTINGS_SITEURL: https://${CHAT_DOMAIN:?}
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${MM_DB_PASSWORD:?}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
    volumes:
      - mattermost-data:/mattermost/data
      - mattermost-config:/mattermost/config
      - mattermost-logs:/mattermost/logs
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8065/api/v4/system/ping >/dev/null']
      interval: 15s
      retries: 20
      start_period: 60s
  outline:
    image: outlinewiki/outline:1.10.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      URL: https://${NOTE_DOMAIN:?}
      PORT: '3000'
      DATABASE_URL: postgres://outline:${OUTLINE_DB_PASSWORD:?}@postgres:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${OUTLINE_SECRET_KEY:?}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET:?}
      FILE_STORAGE: local
      FORCE_HTTPS: 'true'
      SMTP_HOST: ${OAOS_MAIL_SMTP_HOST:-}
      SMTP_PORT: ${OAOS_MAIL_SMTP_PORT:-587}
      SMTP_USERNAME: ${OAOS_MAIL_ADDRESS:-}
      SMTP_PASSWORD: ${OAOS_MAIL_PASSWORD:-}
      SMTP_FROM_EMAIL: ${OAOS_MAIL_ADDRESS:-}
      SMTP_SECURE: 'false'
    volumes:
      - outline-data:/var/lib/outline/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:3000/_health']
      interval: 15s
      retries: 20
      start_period: 60s
volumes:
  postgres-data:
  redis-data:
  mattermost-data:
  mattermost-config:
  mattermost-logs:
  outline-data:
