[project]
name = "open-agent-os-agent-runtime"
version = "0.1.3"
description = "Agent Runtime — §16.1 minimal built-in LLM Runtime (litellm adapter + structured tool loop + gateway-enforced execution)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
litellm = ["litellm>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
