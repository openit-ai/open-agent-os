[project]
name = "open-agent-os-runtime-adapter"
version = "0.1.3"
description = "Runtime Adapter Contract — §16E Runtime-Agnostic abstraction (ABC + factory)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runtime_adapter"]
