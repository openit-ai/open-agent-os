[project]
name = "open-agent-os"
version = "0.1.3"
description = "Open Agent OS — Enterprise Personal Agent Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "email-validator>=2.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "cryptography>=42",
    "python-jose[cryptography]>=3.3",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
    "redis>=5.0",
    "alembic>=1.13",
    "bcrypt>=4.0",
    "argon2-cffi>=23.1",
    "pgvector>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
