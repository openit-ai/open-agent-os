name: Personal cross-platform smoke

on: [push, pull_request]

permissions:
  contents: read

jobs:
  personal-smoke:
    name: Personal smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Expose setup-python as python3 in Git Bash
        if: runner.os == 'Windows'
        run: |
          shim_dir=$(mktemp -d)
          printf '#!/usr/bin/env bash\nexec python "$@"\n' > "$shim_dir/python3"
          chmod +x "$shim_dir/python3"
          printf '%s\n' "$(cygpath -w "$shim_dir")" >> "$GITHUB_PATH"

      - name: Show runner and required tools
        run: |
          uname -a
          bash --version
          if [[ "$RUNNER_OS" == macOS ]]; then /bin/bash --version; fi
          command -v git curl python3
          python3 --version
          if [[ "$RUNNER_OS" == Windows ]]; then
            printf 'MSYSTEM=%s\n' "${MSYSTEM:-unset}"
            command -v cygpath powershell.exe
          fi

      - name: Check all tracked shell syntax
        run: |
          syntax_bash=$(command -v bash)
          if [[ "$RUNNER_OS" == macOS ]]; then syntax_bash=/bin/bash; fi
          printf 'Syntax parser: %s\n' "$syntax_bash"
          git ls-files -z '*.sh' | xargs -0 -n 1 "$syntax_bash" -n

      - name: Run Personal platform smoke with and without HERMES_HOME
        run: |
          HERMES_HOME="$HOME/.hermes" bash bootstrap/tests/platform-smoke.sh
          env -u HERMES_HOME bash bootstrap/tests/platform-smoke.sh

      - name: Run OS-applicable subsystem smoke
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            for suite in install-smoke personal-verify-smoke project-smoke; do
              printf 'Running %s on Linux\n' "$suite"
              bash "bootstrap/tests/$suite.sh"
            done
          else
            printf 'SKIP: install-smoke and project-smoke use Linux /usr/bin, apt, and systemd fixtures.\n'
            printf 'SKIP: personal-verify-smoke uses a Linux systemd/loginctl fixture. Platform mocks run above.\n'
          fi

      - name: Check isolated Personal dry-run leaves HOME empty
        run: |
          isolated_home=$(mktemp -d)
          trap 'rm -rf -- "$isolated_home"' EXIT
          HOME="$isolated_home" bash editions/personal/install.sh --dry-run
          if [[ -n $(ls -A "$isolated_home") ]]; then
            printf 'FAIL: dry-run changed isolated HOME: %s\n' "$isolated_home" >&2
            exit 1
          fi
          printf 'PASS: dry-run exited 0 and left isolated HOME empty\n'

      - name: ShellCheck selected Personal shell files
        run: |
          if [[ "$RUNNER_OS" == macOS ]] && ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            if [[ "$RUNNER_OS" == Windows ]]; then
              printf 'SKIP: ShellCheck is not installed on this Windows runner.\n'
              exit 0
            fi
            printf 'FAIL: ShellCheck is required on Linux and macOS.\n' >&2
            exit 1
          fi
          shellcheck --version
          shellcheck -x \
            bootstrap/lib/common.sh \
            bootstrap/lib/platform.sh \
            bootstrap/verify/personal-verify.sh \
            editions/personal/install.sh \
            bootstrap/tests/platform-smoke.sh
